name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run tokens:check
      - run: npm run contrast
      - run: npm run brand:check
      - run: npm run i18n:review:check
      - run: npm run seed:docs:check
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # The no-database `npm run build` is paused until getSession() stops validating env at prerender (see HANDOFF).
      # The e2e job below still builds the whole app, with a database and the full env.
      - run: npm test
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    env:
      DATABASE_URL: postgresql://gearage:gearage@localhost:5432/gearage
      CRON_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      AUTH_SECRET: ci-only-auth-secret-ci-only-auth-secret-0001
      PASSWORD_PEPPER: ci-only-pepper-ci-only-pepper-0000000001
      CI: "true"
      ENABLE_STYLEGUIDE: "1"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gearage
          POSTGRES_PASSWORD: gearage
          POSTGRES_DB: gearage
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gearage" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      # The migration SQL is hand-written; this proves it matches schema.prisma. Exit code: 0 identical, 2 differences, 1 error.
      - name: Migration drift check
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema --exit-code
      # DB-backed tests (stock, concurrency, constraints, views) run ONLY against a separate *_test database. The runner
      # creates it if missing and refuses anything that is not a local *_test database.
      - name: DB tests
        run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://gearage:gearage@localhost:5432/gearage_test
      # The category pages and menu are served from the database, so the e2e build and server need the seeded catalog.
      - name: Seed catalog
        run: npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
