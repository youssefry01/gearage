name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run tokens:check
      - run: npm run contrast
      - run: npm run brand:check
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    env:
      DATABASE_URL: postgresql://gearage:gearage@localhost:5432/gearage
      CRON_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      CI: "true"
      ENABLE_STYLEGUIDE: "1"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gearage
          POSTGRES_PASSWORD: gearage
          POSTGRES_DB: gearage
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gearage" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
