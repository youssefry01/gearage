# INACTIVE until the app is deployed: only manual runs (workflow_dispatch) are enabled.
# To activate after deployment:
#   1. Add repository secrets APP_URL (e.g. https://your-domain) and CRON_SECRET (same value as the app's env).
#   2. Uncomment the `schedule` block below and commit.
# Purpose: sub-daily trigger for /api/cron/tick (Vercel Hobby cron is daily-only; see docs/adr/0007).
# Best-effort: GitHub may delay runs and disables schedules on inactive public repos after 60 days.
name: cron-tick
on:
  # schedule:
  #   - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call tick endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL/CRON_SECRET not configured; skipping"; exit 0; fi
          curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/tick"
