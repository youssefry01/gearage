services:
  db:
    image: postgres:17-alpine
    container_name: gearage-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gearage
      POSTGRES_PASSWORD: gearage
      POSTGRES_DB: gearage
    ports:
      - "5432:5432"
    volumes:
      - gearage-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gearage -d gearage"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gearage-pgdata:
